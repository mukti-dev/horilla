services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 8000:8000
    restart: unless-stopped
    environment:
      # Set this in a .env file next to docker-compose.yaml
      # Example: DATABASE_URL=postgresql://user:password@your-host:5432/yourdb
      DATABASE_URL: ${DATABASE_URL}
    command: sh ./entrypoint.sh
    volumes:
      - ./horilla:/app/horilla
      - ./media:/app/media
    # No DB container; relies on external Postgres
